[package]
name = "emissary"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51.1", features = ["full"] }
bollard = "0.20.2"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
nom = "8.0.0"
backoff = { version = "0.4.0", features = ["tokio"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
anyhow = "1.0.102"
tracing-panic = "0.1.2"
reqwest = { version = "0.13.3", features = ["json", "rustls", "query"] }
actix = "0.13.5"
futures-util = "0.3.31"
thiserror = "2.0.18"
